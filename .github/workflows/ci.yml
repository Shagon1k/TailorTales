name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read
    pull-requests: read

jobs:
    secret-scan:
        name: Secret scan
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_ENABLE_COMMENTS: 'false'
                  GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

    ci:
        name: Lint, type-check, test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check deployment Compose contract
              run: pnpm compose:deploy:check

            - name: Generate Prisma client
              run: pnpm --filter backend db:generate
              env:
                  DATABASE_URL: postgresql://localhost/ci

            - name: Check (lint + format)
              run: pnpm check

            # next build type-checks against generated .next/types (route params, page props, etc.)
            # which tsc alone misses — catches mismatches between Next.js framework types and our code
            - name: Build (frontend)
              run: pnpm --filter frontend build

            - name: Test
              run: pnpm test
