name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        name: Lint, type-check, test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma client
              run: pnpm --filter backend db:generate
              env:
                  DATABASE_URL: postgresql://localhost/ci

            - name: Check (lint + format)
              run: pnpm check

            # next build type-checks against generated .next/types (route params, page props, etc.)
            # which tsc alone misses — catches mismatches between Next.js framework types and our code
            - name: Build (frontend)
              run: pnpm --filter frontend build

            - name: Test
              run: pnpm test
